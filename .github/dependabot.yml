# Dependabot version + security updates.
#
# Updates that land here are auto-merged by .github/workflows/dependency-auto-merge.yml
# once CI is green, but only for the update types that workflow classifies as safe
# (see ALLOWED_UPDATE_TYPES there). Majors are still opened as PRs; they just wait
# for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    # Batch the low-risk churn into two PRs instead of twenty. Dependabot reports a
    # group's update-type as the highest bump in it, so a grouped PR is only
    # auto-merged when every member of the group is within the allowed range.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # Next.js majors carry App Router migrations; react/react-dom majors follow
      # whatever Next supports. Opening those as PRs is noise, not signal.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
