name: Security Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 13:00 UTC
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  # Blocking: fails a PR only if it *introduces* a high/critical vulnerability
  # through a package.json / package-lock.json change. Existing findings on main
  # do not fail PRs.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

  # Advisory: reports every known vulnerability in production dependencies to
  # the job summary. Never fails the workflow.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      # npm audit only needs package-lock.json, so no install step. npm exits
      # nonzero both when it finds vulnerabilities and when the audit itself
      # fails (e.g. registry outage), so the script below inspects the JSON to
      # tell those apart instead of trusting the exit code.
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'EOF'
          const fs = require("fs");
          const summary = (line = "") =>
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");

          let audit;
          let failure;
          try {
            audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          } catch (err) {
            failure = `could not parse npm audit output (${err.message})`;
          }
          if (!failure && audit.error) {
            failure = [audit.error.code, audit.error.summary].filter(Boolean).join(": ") || "npm audit reported an error";
          } else if (!failure && !audit.metadata?.vulnerabilities) {
            failure = "npm audit output has no vulnerability metadata";
          }

          summary("## npm audit (production dependencies)\n");
          if (failure) {
            summary(`**Audit unavailable:** ${failure.replace(/\s+/g, " ")}\n`);
            summary("Vulnerability counts are unknown for this run; re-run the workflow later.");
            console.log(`::warning::npm audit could not complete, so no vulnerability report was produced (advisory): ${failure.replace(/\s+/g, " ")}`);
            process.exit(0);
          }

          const counts = audit.metadata.vulnerabilities;
          const order = ["critical", "high", "moderate", "low"];
          summary("| Severity | Count |\n|---|---|");
          for (const s of order) summary(`| ${s} | ${counts[s] ?? 0} |`);
          const rows = Object.values(audit.vulnerabilities ?? {})
            .filter((v) => v.severity === "critical" || v.severity === "high")
            .sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity));
          if (rows.length) {
            summary("\n### High and critical\n");
            summary("| Package | Severity | Direct | Fix available |\n|---|---|---|---|");
            for (const v of rows) {
              const fix = typeof v.fixAvailable === "object"
                ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? " (major)" : ""}`
                : v.fixAvailable ? "yes" : "no";
              summary(`| ${v.name} | ${v.severity} | ${v.isDirect ? "yes" : ""} | ${fix} |`);
            }
          }
          summary("\nAdvisory only. Run `npm audit --omit=dev` locally for details.");
          const severe = (counts.critical ?? 0) + (counts.high ?? 0);
          if (severe) {
            console.log(`::warning::npm audit found ${severe} high or critical vulnerabilities in production dependencies (advisory)`);
          }
          EOF
