name: Dependency auto-merge

# Merges Dependabot npm updates and Snyk security-fix PRs once tests and the
# Codex review have passed. The gates live in scripts/dependency-auto-merge.mts.
#
# It sweeps all open dependency PRs whenever a PR's CI or Codex review finishes
# (workflow_run), with a schedule as a fallback. It doesn't use pull_request
# events: workflows triggered by Dependabot get a read-only token, whereas a
# workflow_run workflow runs from main with a write token. Scheduled runs alone
# are not enough, as GitHub delays or drops them under load. Nothing from the
# PR is checked out or executed; the script reads PRs through the API.
#
# Merging uses GITHUB_TOKEN, which main's branch protection lets bypass the
# human-review requirement. Add the `no-auto-merge` label to a PR to opt it out.

on:
  workflow_run:
    workflows:
      - Node.js CI
      - Tests
      - Security Audit
      - CodeQL
      - Codex auto-approve (guarded)
    types: [completed]
  schedule:
    # Fallback sweep twice an hour, off the busy top/half of the hour, when
    # GitHub is most likely to delay or drop scheduled runs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be merged without merging"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependency-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    # Only PR runs matter; pushes to main (e.g. a merge) need no sweep.
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # Pinned to commits: this job can write to main.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (tag v5)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
      - name: Merge eligible dependency PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Snyk opens its PRs under the account that connected the repo.
          SNYK_PR_AUTHORS: jbeard4
        run: node scripts/dependency-auto-merge.mts
