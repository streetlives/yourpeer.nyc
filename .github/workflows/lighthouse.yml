name: Lighthouse

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTHOUSE_BASE_URL: ${{ vars.LIGHTHOUSE_BASE_URL || 'https://yourpeer.nyc' }}

    steps:
      - name: Wait for deployed environment
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail "${LIGHTHOUSE_BASE_URL}/" > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Timed out waiting for ${LIGHTHOUSE_BASE_URL}/"
          exit 1

      - name: Audit URLs using Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.LIGHTHOUSE_BASE_URL }}/
            ${{ env.LIGHTHOUSE_BASE_URL }}/about-us
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Add Lighthouse links to job summary
        if: ${{ always() && steps.lighthouse.outputs.links != '' }}
        env:
          LIGHTHOUSE_LINKS: ${{ steps.lighthouse.outputs.links }}
        run: |
          {
            echo "## Lighthouse report"
            echo
            echo "$LIGHTHOUSE_LINKS"
          } >> "$GITHUB_STEP_SUMMARY"
